<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Đăng nhập Anh Hiếu²</title>
</head>
<body style="margin:0;padding:0;background:#F5EFE6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#2C1E0F;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F5EFE6;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:560px;background:#FBF7F2;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(44,30,15,0.08);">
          <tr>
            <td style="padding:32px 40px 8px 40px;">
              <div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;">
                Anh Hiếu<span style="color:#C4622D;">²</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 40px 0 40px;">
              <h1 style="font-size:26px;font-weight:700;margin:0 0 12px 0;line-height:1.3;">
                Link đăng nhập của bạn 🪄
              </h1>
              <p style="font-size:16px;line-height:1.6;margin:0 0 16px 0;color:#4A3825;">
                Bấm nút bên dưới để đăng nhập vào my TOEIC diary. Không cần mật khẩu.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px;" align="center">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background:#C4622D;color:#FBF7F2;text-decoration:none;
                        padding:14px 32px;border-radius:10px;font-weight:600;font-size:16px;">
                Đăng nhập ngay
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 24px 40px;">
              <p style="font-size:13px;color:#6B5440;line-height:1.6;margin:0 0 8px 0;">
                Hoặc copy link sau vào trình duyệt:
              </p>
              <p style="font-size:12px;color:#8B6F50;word-break:break-all;background:#F5EFE6;padding:10px 12px;border-radius:8px;margin:0;">
                {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 32px 40px;border-top:1px solid #EADFD0;">
              <p style="font-size:12px;color:#8B6F50;line-height:1.6;margin:0;">
                Link sẽ hết hạn sau 1 giờ. Nếu không phải bạn yêu cầu, có thể bỏ qua email.
              </p>
            </td>
          </tr>
        </table>
        <p style="font-size:12px;color:#8B6F50;margin:16px 0 0 0;">
          © Anh Hiếu² · my TOEIC diary
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
